[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a11y-scout"
version = "1.0.0"
description = "Dependency-free static accessibility checks for HTML"
requires-python = ">=3.11"

[project.scripts]
a11yscout = "a11yscout.cli:main"

[tool.setuptools.packages.find]
include = ["a11yscout*"]

