[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timetable-guard"
version = "1.0.0"
description = "Validate schedules and detect timetable conflicts"
requires-python = ">=3.11"

[project.scripts]
timetableguard = "timetableguard.cli:main"

[tool.setuptools.packages.find]
include = ["timetableguard*"]

