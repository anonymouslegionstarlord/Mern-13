[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regex-bench"
version = "1.0.0"
description = "Run JSON-defined regular-expression regression cases"
requires-python = ">=3.11"

[project.scripts]
regexbench = "regexbench.cli:main"

[tool.setuptools.packages.find]
include = ["regexbench*"]

