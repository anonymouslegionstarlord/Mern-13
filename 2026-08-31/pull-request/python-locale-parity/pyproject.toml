[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locale-parity"
version = "1.0.0"
description = "Check JSON translation files for structural parity"
requires-python = ">=3.11"

[project.scripts]
localeparity = "localeparity.cli:main"

[tool.setuptools.packages.find]
include = ["localeparity*"]

