[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-guard"
version = "1.0.0"
description = "Static safety linting for SQL scripts"
requires-python = ">=3.11"

[project.scripts]
sqlguard = "sqlguard.cli:main"

[tool.setuptools.packages.find]
include = ["sqlguard*"]

