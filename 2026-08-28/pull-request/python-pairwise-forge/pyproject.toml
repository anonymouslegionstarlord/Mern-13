[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pairwise-forge"
version = "1.0.0"
description = "Generate compact pairwise test cases from JSON"
requires-python = ">=3.11"

[project.scripts]
pairwiseforge = "pairwiseforge.cli:main"

[tool.setuptools.packages.find]
include = ["pairwiseforge*"]

