[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-delta"
version = "1.0.0"
description = "Offline OpenAPI compatibility checker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
apidelta = "apidelta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

