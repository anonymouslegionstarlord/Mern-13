[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acl-insight"
version = "1.0.0"
description = "Offline firewall ACL validator and rule-shadow analyzer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aclinsight = "aclinsight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
