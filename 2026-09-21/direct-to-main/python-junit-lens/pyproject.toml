[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "junit-lens"
version = "1.0.0"
description = "Offline JUnit XML result analyzer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
junitlens = "junitlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

