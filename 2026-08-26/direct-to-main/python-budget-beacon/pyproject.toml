[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-beacon"
version = "1.0.0"
description = "A dependency-free personal budget CLI"
requires-python = ">=3.11"

[project.scripts]
budgetbeacon = "budgetbeacon.cli:main"

[tool.setuptools.packages.find]
include = ["budgetbeacon*"]

