[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docstring-gauge"
version = "1.0.0"
description = "Measure Python docstring coverage safely with the abstract syntax tree"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
docstring-gauge = "docstring_gauge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

