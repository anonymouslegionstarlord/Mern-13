[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "changelog-craft"
version = "1.0.0"
description = "Generate release notes from Conventional Commit lines"
requires-python = ">=3.11"

[project.scripts]
changelogcraft = "changelogcraft.cli:main"

[tool.setuptools.packages.find]
include = ["changelogcraft*"]

