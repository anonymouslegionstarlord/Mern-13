[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cron-compass"
version = "1.0.0"
description = "Validate cron expressions and preview their next run times"
requires-python = ">=3.11"

[project.scripts]
croncompass = "croncompass.cli:main"

[tool.setuptools.packages.find]
include = ["croncompass*"]

