[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zip-sentry"
version = "1.0.0"
description = "Inspect ZIP archives for unsafe paths and resource risks without extracting them"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
zipsentry = "zipsentry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

