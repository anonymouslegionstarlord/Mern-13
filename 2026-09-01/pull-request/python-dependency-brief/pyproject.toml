[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dependency-brief"
version = "1.0.0"
description = "Offline audit of direct dependencies declared in common project manifests"
requires-python = ">=3.11"

[project.scripts]
dependencybrief = "dependencybrief.cli:main"

[tool.setuptools.packages.find]
include = ["dependencybrief*"]
