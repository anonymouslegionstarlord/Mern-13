[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-trace"
version = "1.0.0"
description = "Offline email-header diagnostics with cautious, explainable findings"
requires-python = ">=3.11"

[project.scripts]
mailtrace = "mailtrace.cli:main"

[tool.setuptools.packages.find]
include = ["mailtrace*"]
