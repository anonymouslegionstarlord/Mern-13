[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-shield"
version = "1.0.0"
description = "Offline CSV structure and spreadsheet-formula risk auditor"
requires-python = ">=3.11"

[project.scripts]
csvshield = "csvshield.cli:main"

[tool.setuptools.packages.find]
include = ["csvshield*"]
